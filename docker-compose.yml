services:
  kanban-viewer:
    image: kanban-viewer
    build:
      context: .
      dockerfile: packages/kanban-viewer/Dockerfile
    container_name: kanban-viewer
    labels:
      dev.orbstack.domains: kanban-viewer.local
    ports:
      - "5566:3000"
    volumes:
      - ./packages/kanban-viewer/prisma/data:/app/prisma/data
    restart: unless-stopped
